<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ROOH CARE | المنتجات</title><link rel="stylesheet" href="style.css"><style>

/* =====================================================
   ROOH CARE - PRODUCTS PAGE
===================================================== */

.rc-products-page{
    max-width:1200px;
    margin:0 auto;
    padding:25px 15px 100px;
}

.rc-products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,310px));
    justify-content:center;
    gap:25px;
}


/* =========================
   PRODUCT CARD
========================= */

.rc-card{
    background:#ffffff;
    border-radius:30px;
    padding:20px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    overflow:hidden;
}

.rc-card-image{
    width:100%;
    height:270px;
    object-fit:contain;
    display:block;
    margin:0 auto 10px;
}

.rc-card-title{
    color:#a47c45;
    font-size:20px;
    line-height:1.7;
    margin:10px 0;
}

.rc-card-title-en{
    display:block;
    color:#777;
    font-size:14px;
    font-weight:normal;
}

.rc-card-description{
    color:#555;
    font-size:15px;
    line-height:1.8;
    min-height:55px;
}

.rc-card-price{
    color:#b07b3c;
    font-size:23px;
    font-weight:bold;
    margin:15px 0;
}


/* =========================
   BUTTONS
========================= */

.rc-buttons{
    display:flex;
    gap:10px;
    width:100%;
    margin-top:15px;
}


/*
   مهم:
   هذه الأزرار تستخدم أسماء جديدة
   ولا تعتمد على .details أو .order
*/

.rc-details-button,
.rc-order-button{

    display:flex !important;

    align-items:center !important;

    justify-content:center !important;

    width:50% !important;

    min-height:48px !important;

    padding:12px 8px !important;

    border-radius:40px !important;

    border:0 !important;

    outline:0 !important;

    font-family:Tahoma,Arial,sans-serif !important;

    font-size:14px !important;

    font-weight:bold !important;

    line-height:1.2 !important;

    text-align:center !important;

    cursor:pointer !important;

    text-decoration:none !important;

    -webkit-text-decoration:none !important;

}


/* التفاصيل */

.rc-details-button,
.rc-details-button:link,
.rc-details-button:visited,
.rc-details-button:hover,
.rc-details-button:active{

    background:linear-gradient(
        135deg,
        #b08a55,
        #8d6637
    ) !important;

    color:#ffffff !important;

    text-decoration:none !important;

}


/* واتساب */

.rc-order-button,
.rc-order-button:link,
.rc-order-button:visited,
.rc-order-button:hover,
.rc-order-button:active{

    background:linear-gradient(
        135deg,
        #25D366,
        #128C7E
    ) !important;

    color:#ffffff !important;

    text-decoration:none !important;

}


/* =========================
   FLOATING WHATSAPP
========================= */

#rc-whatsapp-float{

    position:fixed !important;

    right:18px !important;

    bottom:18px !important;

    width:60px !important;

    height:60px !important;

    min-width:60px !important;

    max-width:60px !important;

    min-height:60px !important;

    max-height:60px !important;

    padding:0 !important;

    margin:0 !important;

    display:flex !important;

    align-items:center !important;

    justify-content:center !important;

    background:#25D366 !important;

    color:#ffffff !important;

    border:0 !important;

    border-radius:50% !important;

    font-family:Arial,sans-serif !important;

    font-size:28px !important;

    font-weight:normal !important;

    line-height:1 !important;

    text-align:center !important;

    text-decoration:none !important;

    box-shadow:0 6px 20px rgba(0,0,0,.25) !important;

    z-index:999999 !important;

    cursor:pointer !important;

}


/* منع أي تنسيق عام للرابط */

#rc-whatsapp-float:link,
#rc-whatsapp-float:visited,
#rc-whatsapp-float:hover,
#rc-whatsapp-float:active{

    width:60px !important;

    height:60px !important;

    color:#ffffff !important;

    text-decoration:none !important;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .rc-products-page{
        padding:15px 12px 100px;
    }

    .rc-products-grid{
        grid-template-columns:1fr;
        gap:20px;
    }

    .rc-card{
        width:100%;
    }

    .rc-card-image{
        height:240px;
    }

    .rc-buttons{
        flex-direction:column;
    }

    .rc-details-button,
    .rc-order-button{
        width:100% !important;
    }

    #rc-whatsapp-float{

        right:15px !important;

        bottom:15px !important;

        width:55px !important;

        height:55px !important;

        min-width:55px !important;

        max-width:55px !important;

        min-height:55px !important;

        max-height:55px !important;

        font-size:25px !important;

    }

}

</footer><script src="products.js"></script><script>

(function(){

const grid =
document.getElementById("rc-products-grid");


if(
typeof products === "undefined" ||
!Array.isArray(products)
){

grid.innerHTML =
"<p>تعذر تحميل المنتجات.</p>";

return;

}


products.forEach(function(product,index){

const card =
document.createElement("article");

card.className="rc-card";


/* الصورة */

const image =
document.createElement("img");

image.className="rc-card-image";

image.src=product.image;

image.alt=product.nameAr;

image.loading="lazy";

card.appendChild(image);


/* الاسم */

const title =
document.createElement("h2");

title.className="rc-card-title";

title.textContent=
product.nameAr;


const english =
document.createElement("span");

english.className=
"rc-card-title-en";

english.textContent=
product.nameEn;

title.appendChild(english);

card.appendChild(title);


/* الوصف */

const description =
document.createElement("p");

description.className=
"rc-card-description";

description.textContent=
product.description;

card.appendChild(description);


/* السعر */

const price =
document.createElement("div");

price.className=
"rc-card-price";

price.textContent=
product.price+" دينار";

card.appendChild(price);


/* الأزرار */

const buttons =
document.createElement("div");

buttons.className="rc-buttons";


/* زر التفاصيل */

const details =
document.createElement("a");

details.className=
"rc-details-button";

details.href=
"product-details.html?id="+index;

details.textContent=
"✨ عرض التفاصيل";


/* زر واتساب */

const order =
document.createElement("a");

order.className=
"rc-order-button";

order.href=
"https://wa.me/9647706136665?text="+
encodeURIComponent(
"السلام عليكم، أريد طلب "+
product.nameAr
);

order.target="_blank";

order.rel=
"noopener noreferrer";

order.textContent=
"🟢 اطلب الآن";


buttons.appendChild(details);

buttons.appendChild(order);

card.appendChild(buttons);

grid.appendChild(card);

});

})();

</script></body></html>
