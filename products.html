<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ROOH CARE | المنتجات</title><link rel="stylesheet" href="style.css"><style>

/* ==================================================
   ROOH CARE PRODUCTS - ISOLATED STYLE
================================================== */

.rc-page{
    max-width:1200px;
    margin:0 auto;
    padding:20px 15px 100px;
}

.rc-products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,310px));
    justify-content:center;
    gap:25px;
}


/* ==================================================
   PRODUCT CARD
================================================== */

.rc-card{
    background:#fff;
    padding:20px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    overflow:hidden;
}

.rc-card img{
    width:100%;
    height:270px;
    object-fit:contain;
    display:block;
    margin:auto;
}

.rc-card h2{
    color:#a47c45;
    font-size:20px;
    line-height:1.7;
    margin:12px 0;
}

.rc-card h2 span{
    display:block;
    color:#777;
    font-size:14px;
    font-weight:normal;
}

.rc-card p{
    color:#555;
    font-size:15px;
    line-height:1.8;
    min-height:55px;
}

.rc-price{
    color:#b07b3c;
    font-size:23px;
    font-weight:bold;
    margin:15px 0;
}


/* ==================================================
   PRODUCT BUTTONS
================================================== */

.rc-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.rc-details,
.rc-order{

    display:flex !important;

    align-items:center !important;
    justify-content:center !important;

    width:50% !important;
    min-height:48px !important;

    padding:12px 8px !important;

    border-radius:40px !important;

    font-family:Tahoma,Arial,sans-serif !important;

    font-size:14px !important;

    font-weight:bold !important;

    line-height:1.2 !important;

    text-align:center !important;

    text-decoration:none !important;

    border:0 !important;

    outline:0 !important;

    cursor:pointer !important;

}


/* التفاصيل */

.rc-details,
.rc-details:link,
.rc-details:visited,
.rc-details:hover,
.rc-details:active{

    background:linear-gradient(
        135deg,
        #b08a55,
        #8d6637
    ) !important;

    color:#fff !important;

    text-decoration:none !important;
}


/* الطلب */

.rc-order,
.rc-order:link,
.rc-order:visited,
.rc-order:hover,
.rc-order:active{

    background:linear-gradient(
        135deg,
        #25D366,
        #128C7E
    ) !important;

    color:#fff !important;

    text-decoration:none !important;
}


/* ==================================================
   WHATSAPP FLOAT
================================================== */

#rc-wa{

    position:fixed !important;

    right:18px !important;
    bottom:18px !important;

    width:58px !important;
    height:58px !important;

    min-width:58px !important;
    min-height:58px !important;

    max-width:58px !important;
    max-height:58px !important;

    display:flex !important;

    align-items:center !important;
    justify-content:center !important;

    padding:0 !important;
    margin:0 !important;

    background:#25D366 !important;

    color:#fff !important;

    border-radius:50% !important;

    border:0 !important;

    font-family:Arial,sans-serif !important;

    font-size:27px !important;

    line-height:1 !important;

    text-align:center !important;

    text-decoration:none !important;

    box-shadow:
    0 6px 20px rgba(0,0,0,.25) !important;

    z-index:999999 !important;
}


/* ==================================================
   FOOTER
   مهم: منع الـ Footer من أن يصبح رابطًا
================================================== */

#rc-footer{

    position:relative !important;

    display:block !important;

    width:100% !important;

    height:auto !important;

    min-height:120px !important;

    margin:30px 0 0 !important;

    padding:35px 15px !important;

    background:#fff !important;

    color:#777 !important;

    text-align:center !important;

    font-family:Tahoma,Arial,sans-serif !important;

    font-size:14px !important;

    line-height:2 !important;

    z-index:1 !important;

}


/* التأكد أن نص الفوتر ليس رابطًا */

#rc-footer a{

    position:static !important;

    display:inline !important;

    width:auto !important;

    height:auto !important;

    background:none !important;

    color:#777 !important;

    padding:0 !important;

    margin:0 !important;

    border-radius:0 !important;

    box-shadow:none !important;

    text-decoration:none !important;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:600px){

    .rc-page{
        padding:15px 12px 100px;
    }

    .rc-products{
        grid-template-columns:1fr;
    }

    .rc-card img{
        height:240px;
    }

    .rc-buttons{
        flex-direction:column;
    }

    .rc-details,
    .rc-order{
        width:100% !important;
    }

    #rc-wa{

        right:15px !important;
        bottom:15px !important;

        width:55px !important;
        height:55px !important;

        min-width:55px !important;
        min-height:55px !important;

        max-width:55px !important;
        max-height:55px !important;

        font-size:25px !important;
    }

}

================================================== --><footer id="rc-footer"><div>
<strong>ROOH CARE © 2026</strong>
</div><div>
Premium Korean Beauty Store
</div></footer><script src="products.js"></script><script>

(function(){

const container =
document.getElementById("rc-products");


if(
typeof products === "undefined" ||
!Array.isArray(products)
){

container.innerHTML =
"<p>تعذر تحميل المنتجات.</p>";

return;

}


products.forEach(function(product,index){

const card =
document.createElement("article");

card.className="rc-card";


/* الصورة */

const image =
document.createElement("img");

image.src=product.image;

image.alt=product.nameAr;

image.loading="lazy";

card.appendChild(image);


/* الاسم */

const title =
document.createElement("h2");

title.textContent=
product.nameAr;


const english =
document.createElement("span");

english.textContent=
product.nameEn;

title.appendChild(english);

card.appendChild(title);


/* الوصف */

const description =
document.createElement("p");

description.textContent=
product.description;

card.appendChild(description);


/* السعر */

const price =
document.createElement("div");

price.className="rc-price";

price.textContent=
product.price+" دينار";

card.appendChild(price);


/* الأزرار */

const buttons =
document.createElement("div");

buttons.className="rc-buttons";


/* تفاصيل */

const details =
document.createElement("a");

details.className="rc-details";

details.href=
"product-details.html?id="+index;

details.textContent=
"✨ عرض التفاصيل";


/* واتساب */

const order =
document.createElement("a");

order.className="rc-order";

order.href=
"https://wa.me/9647706136665?text="+
encodeURIComponent(
"السلام عليكم، أريد طلب "+
product.nameAr
);

order.target="_blank";

order.rel=
"noopener noreferrer";

order.textContent=
"🟢 اطلب الآن";


buttons.appendChild(details);

buttons.appendChild(order);

card.appendChild(buttons);

container.appendChild(card);

});

})();

</script></body></html>
