/* ==================================================
   PRODUCTS PAGE
================================================== */

.products-page{

max-width:1200px;

margin:0 auto;

padding:20px 15px 60px;

}

.products{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(270px,310px));

justify-content:center;

gap:25px;

}


/* ==================================================
   PRODUCT CARD
================================================== */

.card{

background:#fff;

width:100%;

padding:20px;

border-radius:30px;

text-align:center;

box-shadow:
0 8px 25px rgba(0,0,0,.08);

transition:
transform .3s ease,
box-shadow .3s ease;

overflow:hidden;

}

.card:hover{

transform:translateY(-5px);

box-shadow:
0 12px 30px rgba(0,0,0,.12);

}


.card img{

display:block;

width:100%;

height:270px;

object-fit:contain;

margin:0 auto 10px;

}


.card h2{

font-size:20px;

color:#a47c45;

line-height:1.7;

margin:10px 0;

}


.card h2 small{

display:block;

font-size:14px;

color:#777;

font-weight:normal;

}


.card p{

font-size:15px;

color:#555;

line-height:1.8;

min-height:55px;

margin:10px 0;

}


.price{

font-size:23px;

font-weight:bold;

color:#b07b3c;

margin:15px 0;

}


/* ==================================================
   PRODUCT BUTTONS
================================================== */

.card-buttons{

display:flex;

align-items:center;

justify-content:center;

gap:10px;

flex-wrap:wrap;

margin-top:15px;

}


/* جميع الروابط داخل البطاقة */

.card-buttons a{

text-decoration:none !important;

-webkit-text-decoration:none !important;

}


/* DETAILS BUTTON */

.card-buttons .details{

display:inline-flex;

align-items:center;

justify-content:center;

width:auto;

min-width:130px;

min-height:48px;

padding:12px 20px;

background:
linear-gradient(
135deg,
#b08a55,
#8d6637
);

color:#fff !important;

border:none;

border-radius:40px;

font-family:Tahoma,Arial,sans-serif;

font-size:15px;

font-weight:bold;

line-height:1.2;

text-align:center;

cursor:pointer;

text-decoration:none !important;

box-shadow:
0 5px 15px rgba(0,0,0,.12);

}


/* ORDER BUTTON */

.card-buttons .order{

display:inline-flex;

align-items:center;

justify-content:center;

width:auto;

min-width:120px;

min-height:48px;

padding:12px 20px;

background:
linear-gradient(
135deg,
#25D366,
#128C7E
);

color:#fff !important;

border:none;

border-radius:40px;

font-family:Tahoma,Arial,sans-serif;

font-size:15px;

font-weight:bold;

line-height:1.2;

text-align:center;

cursor:pointer;

text-decoration:none !important;

box-shadow:
0 5px 15px rgba(0,0,0,.12);

}


/* إزالة الخط الأزرق نهائيًا */

.card-buttons .details:visited,
.card-buttons .details:hover,
.card-buttons .details:active,

.card-buttons .order:visited,
.card-buttons .order:hover,
.card-buttons .order:active{

color:#fff !important;

text-decoration:none !important;

}


/* ==================================================
   EMPTY
================================================== */

.empty{

background:#fff;

padding:50px 20px;

border-radius:30px;

text-align:center;

font-size:20px;

color:#777;

box-shadow:
0 8px 25px rgba(0,0,0,.08);

}


/* ==================================================
   WHATSAPP FLOAT
================================================== */

body a.whatsapp-float{

position:fixed !important;

right:18px !important;

bottom:18px !important;

width:60px !important;

height:60px !important;

min-width:60px !important;

min-height:60px !important;

max-width:60px !important;

max-height:60px !important;

display:flex !important;

align-items:center !important;

justify-content:center !important;

padding:0 !important;

margin:0 !important;

background:#25D366 !important;

color:#fff !important;

border-radius:50% !important;

border:none !important;

font-family:Arial,sans-serif !important;

font-size:29px !important;

font-weight:normal !important;

line-height:1 !important;

text-align:center !important;

text-decoration:none !important;

box-shadow:
0 7px 22px rgba(0,0,0,.25) !important;

z-index:99999 !important;

}


/* منع أي تأثير للرابط */

body a.whatsapp-float:visited,
body a.whatsapp-float:hover,
body a.whatsapp-float:active{

color:#fff !important;

text-decoration:none !important;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:600px){

.products-page{

padding:15px 12px 80px;

}

.products{

grid-template-columns:1fr;

gap:20px;

}

.card{

width:100%;

padding:18px;

}

.card img{

height:240px;

}

.card-buttons{

flex-direction:column;

width:100%;

}

.card-buttons .details,
.card-buttons .order{

width:100%;

min-width:100%;

}

body a.whatsapp-float{

right:15px !important;

bottom:15px !important;

width:55px !important;

height:55px !important;

min-width:55px !important;

min-height:55px !important;

max-width:55px !important;

max-height:55px !important;

font-size:26px !important;

}

}


/* ==================================================
   PREVENT BLUE LINKS
================================================== */

.products-page a{

-webkit-tap-highlight-color:transparent;

}

.products-page a:not(.details):not(.order){

color:inherit;

}

</footer><!-- ==================================================

================================================== --><script src="products.js"></script><!-- ==================================================
     DISPLAY PRODUCTS
================================================== --><script>

(function(){

const container =
document.getElementById(
"products-container"
);


if(
typeof products === "undefined" ||
!Array.isArray(products) ||
products.length === 0
){

container.innerHTML = `

<div class="empty">

لا توجد منتجات حاليًا

</div>

`;

return;

}


products.forEach(function(product,index){


const card =
document.createElement("article");

card.className="card";


/* الصورة */

const image =
document.createElement("img");

image.src =
product.image;

image.alt =
product.nameAr;

image.loading="lazy";


image.onerror=function(){

this.alt="صورة المنتج غير متوفرة";

this.style.opacity="0.4";

};


card.appendChild(image);


/* الاسم */

const title =
document.createElement("h2");

title.innerHTML =
`
${escapeHTML(product.nameAr)}
<small>
${escapeHTML(product.nameEn)}
</small>
`;

card.appendChild(title);


/* الوصف */

const description =
document.createElement("p");

description.textContent =
product.description;

card.appendChild(description);


/* السعر */

const price =
document.createElement("div");

price.className="price";

price.textContent =
product.price + " دينار";

card.appendChild(price);


/* الأزرار */

const buttons =
document.createElement("div");

buttons.className=
"card-buttons";


/* زر التفاصيل */

const details =
document.createElement("a");

details.className="details";

details.href =
"product-details.html?id=" + index;

details.textContent =
"✨ عرض التفاصيل";


/* زر واتساب */

const order =
document.createElement("a");

order.className="order";

order.href =
"https://wa.me/9647706136665?text=" +
encodeURIComponent(
"السلام عليكم، أريد طلب " +
product.nameAr
);

order.target="_blank";

order.rel="noopener noreferrer";

order.textContent =
"🟢 اطلب الآن";


buttons.appendChild(details);

buttons.appendChild(order);

card.appendChild(buttons);


container.appendChild(card);

});


/* ==================================================
   حماية النصوص
================================================== */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

})();
