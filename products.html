<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ROOH CARE | المنتجات
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar">

<a href="index.html">
🏠 الرئيسية
</a>


<a href="products.html">
🧴 المنتجات
</a>


<a href="add-product.html">
⚙️ إدارة المنتجات
</a>


<a href="https://wa.me/9647706136665" target="_blank">
💬 واتساب
</a>

</nav>




<header>

<div class="logo">

<img src="images/logo.png" alt="ROOH CARE">

</div>


<h1>
ROOH CARE
</h1>


<p>
منتجات العناية الكورية الأصلية
</p>


</header>





<h2 class="title">
جميع المنتجات
</h2>





<section class="products" id="products-container">

</section>






<a class="whatsapp-float"

href="https://wa.me/9647706136665"

target="_blank">

💚

</a>







<footer>

ROOH CARE © 2026

<br>

Premium Korean Beauty Store

</footer>






<script src="products.js"></script>


<script>


const container = document.getElementById("products-container");



if(typeof products !== "undefined"){



products.forEach(product => {



container.innerHTML += `


<div class="card">



<img src="${product.image}" alt="${product.nameAr}">



<h2>

${product.nameAr}

<br>

${product.nameEn}

</h2>



<p>

${product.description}

</p>




<div class="price">

${product.price} دينار

</div>





<a class="details"

href="product-details.html?product=${encodeURIComponent(product.nameEn)}"

✨ عرض التفاصيل

</a>




<a class="order"

href="https://wa.me/9647706136665?text=اريد طلب ${product.nameAr}"

target="_blank">

🟢 اطلب الآن

</a>



</div>



`;



});



}

else{


container.innerHTML =

"<h3>لم يتم تحميل المنتجات</h3>";

}



</script>



</body>

</html>
