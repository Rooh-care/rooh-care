<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ROOH CARE | تفاصيل المنتج</title><link rel="stylesheet" href="style.css"><style>

/* ==================================================
   PRODUCT DETAILS - ROOH CARE
================================================== */

.rc-detail-page{

    max-width:1000px;

    margin:30px auto;

    padding:20px 15px 100px;

}


/* ==================================================
   PRODUCT BOX
================================================== */

.rc-detail-box{

    background:#fff;

    border-radius:35px;

    padding:30px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:40px;

    align-items:center;

    box-shadow:0 8px 30px rgba(0,0,0,.08);

}


/* ==================================================
   PRODUCT IMAGE
================================================== */

.rc-detail-image{

    width:100%;

    height:430px;

    object-fit:contain;

    display:block;

}


/* ==================================================
   PRODUCT INFORMATION
================================================== */

.rc-detail-info{

    text-align:right;

}

.rc-detail-name{

    color:#a47c45;

    font-size:30px;

    line-height:1.6;

    margin:0 0 5px;

}

.rc-detail-name-en{

    color:#777;

    font-size:16px;

}

.rc-detail-category{

    display:inline-block;

    background:#faf7f1;

    color:#a47c45;

    padding:8px 18px;

    border-radius:30px;

    font-weight:bold;

    margin:15px 0;

}

.rc-detail-description{

    color:#555;

    font-size:17px;

    line-height:2;

}

.rc-detail-price{

    color:#b07b3c;

    font-size:30px;

    font-weight:bold;

    margin:20px 0;

}


/* ==================================================
   BUTTONS
================================================== */

.rc-detail-buttons{

    display:flex;

    gap:12px;

    flex-wrap:wrap;

}


.rc-buy-button,
.rc-back-button{

    display:inline-flex !important;

    align-items:center !important;

    justify-content:center !important;

    min-height:50px !important;

    padding:14px 22px !important;

    border-radius:35px !important;

    border:0 !important;

    outline:0 !important;

    font-family:Tahoma,Arial,sans-serif !important;

    font-size:15px !important;

    font-weight:bold !important;

    line-height:1.2 !important;

    text-decoration:none !important;

    cursor:pointer !important;

}


/* واتساب */

.rc-buy-button,
.rc-buy-button:link,
.rc-buy-button:visited,
.rc-buy-button:hover,
.rc-buy-button:active{

    background:linear-gradient(
        135deg,
        #25D366,
        #128C7E
    ) !important;

    color:#fff !important;

    text-decoration:none !important;

}


/* العودة */

.rc-back-button,
.rc-back-button:link,
.rc-back-button:visited,
.rc-back-button:hover,
.rc-back-button:active{

    background:linear-gradient(
        135deg,
        #b08a55,
        #8d6637
    ) !important;

    color:#fff !important;

    text-decoration:none !important;

}


/* ==================================================
   FOOTER
   مهم جدًا: لا يوجد أي FLOAT هنا
================================================== */

#rc-detail-footer{

    position:relative !important;

    display:block !important;

    width:100% !important;

    height:auto !important;

    min-height:120px !important;

    margin:30px 0 0 !important;

    padding:35px 15px !important;

    background:#fff !important;

    color:#777 !important;

    text-align:center !important;

    font-family:Tahoma,Arial,sans-serif !important;

    font-size:14px !important;

    line-height:2 !important;

    float:none !important;

    clear:both !important;

    z-index:1 !important;

}


/* ==================================================
   FLOATING WHATSAPP
================================================== */

#rc-detail-wa{

    position:fixed !important;

    right:18px !important;

    bottom:18px !important;

    width:60px !important;

    height:60px !important;

    min-width:60px !important;

    min-height:60px !important;

    max-width:60px !important;

    max-height:60px !important;

    display:flex !important;

    align-items:center !important;

    justify-content:center !important;

    padding:0 !important;

    margin:0 !important;

    background:#25D366 !important;

    color:#fff !important;

    border:0 !important;

    border-radius:50% !important;

    font-family:Arial,sans-serif !important;

    font-size:28px !important;

    line-height:1 !important;

    text-align:center !important;

    text-decoration:none !important;

    box-shadow:0 6px 20px rgba(0,0,0,.25) !important;

    z-index:999999 !important;

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:700px){

    .rc-detail-page{

        margin:20px auto;

        padding:15px 12px 100px;

    }


    .rc-detail-box{

        grid-template-columns:1fr;

        padding:20px;

        gap:20px;

    }


    .rc-detail-image{

        height:300px;

    }


    .rc-detail-info{

        text-align:center;

    }


    .rc-detail-name{

        font-size:25px;

    }


    .rc-detail-description{

        font-size:15px;

    }


    .rc-detail-buttons{

        flex-direction:column;

    }


    .rc-buy-button,
    .rc-back-button{

        width:100% !important;

    }


    #rc-detail-wa{

        right:15px !important;

        bottom:15px !important;

        width:55px !important;

        height:55px !important;

        min-width:55px !important;

        min-height:55px !important;

        max-width:55px !important;

        max-height:55px !important;

        font-size:25px !important;

    }

}

<!-- ==================================================
     PRODUCTS DATA
================================================== --><script src="products.js"></script><script>

(function(){

    const container =
    document.getElementById(
        "rc-detail-container"
    );


    const params =
    new URLSearchParams(
        window.location.search
    );


    const id =
    parseInt(
        params.get("id"),
        10
    );


    /* التحقق من المنتج */

    if(

        typeof products === "undefined" ||

        !Array.isArray(products) ||

        isNaN(id) ||

        id < 0 ||

        id >= products.length

    ){

        container.innerHTML=`

        <div style="
            background:#fff;
            border-radius:30px;
            padding:50px 20px;
            text-align:center;
            box-shadow:0 8px 25px rgba(0,0,0,.08);
        ">

            <h2 style="color:#a47c45;">
                المنتج غير موجود
            </h2>

            <p>
                عذرًا، لم نتمكن من العثور على المنتج.
            </p>

            <a
                href="products.html"
                class="rc-back-button"
            >
                ↩ العودة إلى المنتجات
            </a>

        </div>

        `;

        return;

    }


    const product =
    products[id];


    document.title =
    "ROOH CARE | "+
    product.nameAr;


    /* ==================================================
       BOX
    ================================================== */

    const box =
    document.createElement("div");

    box.className=
    "rc-detail-box";


    /* ==================================================
       IMAGE
    ================================================== */

    const imageWrapper =
    document.createElement("div");


    const image =
    document.createElement("img");

    image.className=
    "rc-detail-image";

    image.src=
    product.image;

    image.alt=
    product.nameAr;

    image.loading="lazy";


    imageWrapper.appendChild(image);

    box.appendChild(imageWrapper);


    /* ==================================================
       INFO
    ================================================== */

    const info =
    document.createElement("div");

    info.className=
    "rc-detail-info";


    /* الاسم */

    const name =
    document.createElement("h1");

    name.className=
    "rc-detail-name";

    name.textContent=
    product.nameAr;

    info.appendChild(name);


    /* الاسم الإنجليزي */

    const nameEn =
    document.createElement("div");

    nameEn.className=
    "rc-detail-name-en";

    nameEn.textContent=
    product.nameEn;

    info.appendChild(nameEn);


    /* التصنيف */

    const category =
    document.createElement("div");

    category.className=
    "rc-detail-category";

    category.textContent=
    product.category;

    info.appendChild(category);


    /* الوصف */

    const description =
    document.createElement("p");

    description.className=
    "rc-detail-description";

    description.textContent=
    product.description;

    info.appendChild(description);


    /* السعر */

    const price =
    document.createElement("div");

    price.className=
    "rc-detail-price";

    price.textContent=
    product.price+
    " دينار";

    info.appendChild(price);


    /* ==================================================
       BUTTONS
    ================================================== */

    const buttons =
    document.createElement("div");

    buttons.className=
    "rc-detail-buttons";


    /* واتساب */

    const buy =
    document.createElement("a");

    buy.className=
    "rc-buy-button";

    buy.href=
    "https://wa.me/9647706136665?text="+
    encodeURIComponent(
        "السلام عليكم، أريد طلب "+
        product.nameAr+
        " بسعر "+
        product.price+
        " دينار"
    );

    buy.target="_blank";

    buy.rel=
    "noopener noreferrer";

    buy.textContent=
    "🟢 اطلب المنتج عبر واتساب";


    /* العودة */

    const back =
    document.createElement("a");

    back.className=
    "rc-back-button";

    back.href=
    "products.html";

    back.textContent=
    "↩ العودة إلى المنتجات";


    buttons.appendChild(buy);

    buttons.appendChild(back);

    info.appendChild(buttons);


    box.appendChild(info);

    container.appendChild(box);

})();

</script></body></html>
