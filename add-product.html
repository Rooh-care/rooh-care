/*
========================================
رابط ROOH CARE Worker
لا تغيّره
========================================
*/

const WORKER_URL =
"https://rooh-care-admin.ahmed-j51.workers.dev";


async function addProduct(){

const button =
document.getElementById("addButton");

const message =
document.getElementById("message");


const product = {

nameAr:
document.getElementById("nameAr").value.trim(),

nameEn:
document.getElementById("nameEn").value.trim(),

price:
document.getElementById("price").value.trim(),

category:
document.getElementById("category").value.trim(),

image:
document.getElementById("image").value.trim(),

description:
document.getElementById("description").value.trim()

};


/* التحقق */

if(!product.nameAr){

showMessage(
"❌ اكتب اسم المنتج بالعربي",
"error"
);

return;

}

if(!product.nameEn){

showMessage(
"❌ اكتب اسم المنتج بالإنجليزي",
"error"
);

return;

}

if(!product.price){

showMessage(
"❌ اكتب سعر المنتج",
"error"
);

return;

}

if(!product.category){

showMessage(
"❌ اختر تصنيف المنتج",
"error"
);

return;

}

if(!product.image){

showMessage(
"❌ اكتب مسار الصورة",
"error"
);

return;

}

if(!product.description){

showMessage(
"❌ اكتب وصف المنتج",
"error"
);

return;

}


/* بدء العملية */

button.disabled=true;

button.textContent=
"⏳ جاري إضافة المنتج...";

showMessage(
"جاري الاتصال بالمتجر...",
"loading"
);


/*
========================================
إرسال المنتج
========================================
*/

try{

const controller =
new AbortController();

const timer =
setTimeout(
function(){

controller.abort();

},
20000
);


const response =
await fetch(

WORKER_URL + "/add-product",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(product),

signal:
controller.signal

}

);


clearTimeout(timer);


const text =
await response.text();


let data;


try{

data =
JSON.parse(text);

}

catch{

throw new Error(
"لم تصل استجابة صحيحة من Worker"
);

}


if(!response.ok){

throw new Error(

data.message ||
"حدث خطأ أثناء الإضافة"

);

}


if(!data.success){

throw new Error(

data.message ||
"لم تتم إضافة المنتج"

);

}


/* نجاح */

showMessage(

"✅ تمت إضافة المنتج بنجاح!\n\n" +
"تم إرسال المنتج إلى GitHub.",

"success"

);


/* تنظيف الحقول */

document.getElementById("nameAr")
.value="";

document.getElementById("nameEn")
.value="";

document.getElementById("price")
.value="";

document.getElementById("category")
.value="";

document.getElementById("image")
.value="";

document.getElementById("description")
.value="";


}

catch(error){

if(error.name==="AbortError"){

showMessage(

"❌ انتهى الاتصال بعد 20 ثانية.\n\n" +
"لم يصل رد من Worker.",

"error"

);

}else{

showMessage(

"❌ لم تتم إضافة المنتج\n\n" +
error.message,

"error"

);

}

}


button.disabled=false;

button.textContent=
"➕ إضافة المنتج";

}


/*
========================================
عرض الرسائل
========================================
*/

function showMessage(text,type){

const message =
document.getElementById("message");

message.className =
"message " + type;

message.textContent =
text;

}
