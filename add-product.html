<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROOH CARE | إدارة المنتجات</title>

<link rel="stylesheet" href="style.css">

<style>

.admin-box{
max-width:700px;
margin:30px auto;
background:white;
padding:30px;
border-radius:30px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.form-group{
margin-bottom:18px;
}

.form-group label{
display:block;
font-weight:bold;
color:#a47c45;
margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{

width:100%;
padding:13px;

border:1px solid #ddd;

border-radius:15px;

font-family:Tahoma,Arial,sans-serif;

font-size:15px;

}

.form-group textarea{
min-height:120px;
resize:vertical;
}

.status{
margin-top:20px;
padding:15px;
border-radius:15px;
display:none;
font-weight:bold;
}

.success{
background:#e8f8ee;
color:#16803c;
}

.error{
background:#fdeaea;
color:#b42318;
}

.loading{
background:#fff5dc;
color:#8a641f;
}

</style>

</head>


<body>


<nav class="navbar">

<a href="index.html">🏠 الرئيسية</a>

<a href="products.html">🧴 المنتجات</a>

<a href="add-product.html">⚙️ إدارة المنتجات</a>

<a href="https://wa.me/9647706136665" target="_blank">
💬 واتساب
</a>

</nav>



<header>

<div class="logo">

<img src="images/logo.png" alt="ROOH CARE">

</div>

<h1>إدارة المنتجات</h1>

<p>إضافة المنتجات مباشرة إلى المتجر</p>

</header>



<section class="admin-box">

<h2 class="title">
إضافة منتج جديد
</h2>



<div class="form-group">

<label>
اسم المنتج بالعربي
</label>

<input
id="nameAr"
type="text"
placeholder="مثال: كريم ترطيب البشرة"
>

</div>



<div class="form-group">

<label>
اسم المنتج بالإنجليزي
</label>

<input
id="nameEn"
type="text"
placeholder="مثال: USHAS MOISTURIZER"
>

</div>



<div class="form-group">

<label>
السعر
</label>

<input
id="price"
type="number"
placeholder="10000"
>

</div>



<div class="form-group">

<label>
التصنيف
</label>

<select id="category">

<option value="">اختر التصنيف</option>

<option value="السيرومات">السيرومات</option>

<option value="تنظيف البشرة">تنظيف البشرة</option>

<option value="الكريمات">الكريمات</option>

<option value="المرطبات">المرطبات</option>

<option value="واقي الشمس">واقي الشمس</option>

<option value="العناية بالشعر">العناية بالشعر</option>

<option value="العناية بالجسم">العناية بالجسم</option>

<option value="أخرى">أخرى</option>

</select>

</div>



<div class="form-group">

<label>
اسم صورة المنتج
</label>

<input
id="image"
type="text"
placeholder="مثال: new-product.jpg"
>

</div>



<div class="form-group">

<label>
وصف المنتج
</label>

<textarea
id="description"
placeholder="اكتب وصف المنتج..."
></textarea>

</div>



<button
class="main-btn"
type="button"
onclick="addProduct()"
>

➕ إضافة المنتج إلى المتجر

</button>



<div
id="status"
class="status"
></div>

</section>



<footer>

ROOH CARE © 2026

<br>

Premium Korean Beauty Store

</footer>



<script>


// ضع هنا رابط Worker الخاص بك
const WORKER_URL =
"https://rooh-care-admin.ahmed-j51.workers.dev/";



async function addProduct(){

const status =
document.getElementById("status");


const nameAr =
document.getElementById("nameAr")
.value.trim();


const nameEn =
document.getElementById("nameEn")
.value.trim();


const price =
document.getElementById("price")
.value.trim();


const category =
document.getElementById("category")
.value.trim();


const image =
document.getElementById("image")
.value.trim();


const description =
document.getElementById("description")
.value.trim();



if(!nameAr){

showStatus(
"يرجى كتابة اسم المنتج بالعربي",
"error"
);

return;

}


if(!nameEn){

showStatus(
"يرجى كتابة اسم المنتج بالإنجليزي",
"error"
);

return;

}


if(!price){

showStatus(
"يرجى كتابة السعر",
"error"
);

return;

}


if(!category){

showStatus(
"يرجى اختيار التصنيف",
"error"
);

return;

}


if(!image){

showStatus(
"يرجى كتابة اسم الصورة",
"error"
);

return;

}


if(!description){

showStatus(
"يرجى كتابة وصف المنتج",
"error"
);

return;

}



showStatus(
"⏳ جاري إضافة المنتج إلى المتجر...",
"loading"
);



try{


const response =
await fetch(
WORKER_URL + "/add-product",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

nameAr:nameAr,

nameEn:nameEn,

price:price,

image:image,

category:category,

description:description

})

}
);



const data =
await response.json();



if(!response.ok || !data.success){

throw new Error(
data.message ||
"حدث خطأ أثناء إضافة المنتج"
);

}



showStatus(
"✅ تمت إضافة المنتج بنجاح! سيظهر في المتجر بعد تحديث GitHub Pages.",
"success"
);



document.getElementById("nameAr").value="";

document.getElementById("nameEn").value="";

document.getElementById("price").value="";

document.getElementById("category").value="";

document.getElementById("image").value="";

document.getElementById("description").value="";



}

catch(error){

console.error(error);

showStatus(
"❌ " + error.message,
"error"
);

}

}



function showStatus(message,type){

const status =
document.getElementById("status");

status.style.display="block";

status.className =
"status " + type;

status.textContent =
message;

}

</script>


</body>

</html>
