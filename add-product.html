<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ROOH CARE | إدارة المنتجات
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar">

<a href="index.html">
🏠 الرئيسية
</a>


<a href="products.html">
🧴 المنتجات
</a>


<a href="add-product.html">
⚙️ إدارة المنتجات
</a>


</nav>



<header>

<div class="logo">

<img src="images/logo.png">

</div>


<h1>
إضافة منتج جديد
</h1>


<p>
أنشئ كود المنتج بسهولة ثم أضفه إلى products.js
</p>

</header>





<section class="info">


<h2 class="title">
بيانات المنتج
</h2>



<input id="nameAr" placeholder="اسم المنتج بالعربي">


<br><br>


<input id="nameEn" placeholder="اسم المنتج بالإنجليزي">


<br><br>


<input id="price" placeholder="السعر">


<br><br>


<input id="image" placeholder="اسم الصورة مثال: serum.jpg">


<br><br>


<input id="category" placeholder="التصنيف">


<br><br>


<textarea id="description" placeholder="وصف المنتج"></textarea>


<br><br>



<button class="main-btn" onclick="createProduct()">

إنشاء كود المنتج

</button>



</section>






<section class="info">


<h2 class="title">
الكود الناتج
</h2>


<textarea id="result"

style="width:90%;height:300px;direction:ltr;text-align:left;">

</textarea>


<br>


<button class="main-btn" onclick="copyCode()">

📋 نسخ الكود

</button>



</section>







<footer>

ROOH CARE © 2026

</footer>






<script>


function createProduct(){


let nameAr =
document.getElementById("nameAr").value;


let nameEn =
document.getElementById("nameEn").value;


let price =
document.getElementById("price").value;


let image =
document.getElementById("image").value;


let category =
document.getElementById("category").value;


let description =
document.getElementById("description").value;



let code = `

{

nameAr:"${nameAr}",

nameEn:"${nameEn}",

price:"${price}",

image:"images/${image}",

category:"${category}",

description:"${description}"

},

`;



document.getElementById("result").value = code;


}




function copyCode(){


let text =
document.getElementById("result");


text.select();


navigator.clipboard.writeText(text.value);


alert("تم نسخ كود المنتج");


}


</script>



</body>

</html>
