/* ==================================
رابط Worker الخاص بك
لا تغيّره
================================== */

const WORKER_URL =
"https://rooh-care-admin.ahmed-j51.workers.dev";


/* ==================================
إضافة المنتج
================================== */

async function addProduct(){

const button =
document.getElementById("addButton");

const message =
document.getElementById("message");


const product = {

nameAr:
document.getElementById("nameAr").value.trim(),

nameEn:
document.getElementById("nameEn").value.trim(),

price:
document.getElementById("price").value.trim(),

category:
document.getElementById("category").value.trim(),

image:
document.getElementById("image").value.trim(),

description:
document.getElementById("description").value.trim()

};


/* التحقق */

if(!product.nameAr){

showMessage(
"❌ اكتب اسم المنتج بالعربي",
"error"
);

return;

}


if(!product.nameEn){

showMessage(
"❌ اكتب اسم المنتج بالإنجليزي",
"error"
);

return;

}


if(!product.price){

showMessage(
"❌ اكتب السعر",
"error"
);

return;

}


if(!product.category){

showMessage(
"❌ اختر التصنيف",
"error"
);

return;

}


if(!product.image){

showMessage(
"❌ اكتب اسم الصورة",
"error"
);

return;

}


if(!product.description){

showMessage(
"❌ اكتب وصف المنتج",
"error"
);

return;

}


/* بدء الإضافة */

button.disabled=true;

button.textContent=
"⏳ جاري إضافة المنتج...";

showMessage(
"جاري الاتصال بالمتجر...",
"loading"
);


try{


const response =
await fetch(

WORKER_URL + "/add-product",

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(product)

}

);


const text =
await response.text();


let data;


try{

data =
JSON.parse(text);

}

catch{

throw new Error(
"Worker لم يرجع استجابة صحيحة"
);

}


if(!response.ok){

throw new Error(
data.message ||
"حدث خطأ في Worker"
);

}


if(!data.success){

throw new Error(
data.message ||
"لم تتم إضافة المنتج"
);

}


/* نجاح */

showMessage(

"✅ تمت إضافة المنتج بنجاح!\n\n" +
"تم إرسال المنتج إلى GitHub.",

"success"

);


/* مسح البيانات */

document.getElementById("nameAr")
.value="";

document.getElementById("nameEn")
.value="";

document.getElementById("price")
.value="";

document.getElementById("category")
.value="";

document.getElementById("image")
.value="";

document.getElementById("description")
.value="";


}

catch(error){

showMessage(

"❌ فشل إضافة المنتج\n\n" +
error.message,

"error"

);

}


button.disabled=false;

button.textContent=
"➕ إضافة المنتج";

}


/* ==================================
الرسائل
================================== */

function showMessage(text,type){

const message =
document.getElementById("message");

message.className =
"message " + type;

message.textContent =
text;

}

</script></body></html>
