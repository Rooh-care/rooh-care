رابط ROOH CARE Worker
تم وضع الرابط الحقيقي هنا
لا تحتاج إلى تغييره

const WORKER_URL =
"https://rooh-care-admin.ahmed-j51.workers.dev";


async function addProduct(){


const button =
document.getElementById("addButton");

const status =
document.getElementById("status");


const nameAr =
document.getElementById("nameAr")
.value
.trim();


const nameEn =
document.getElementById("nameEn")
.value
.trim();


const price =
document.getElementById("price")
.value
.trim();


const category =
document.getElementById("category")
.value
.trim();


const image =
document.getElementById("image")
.value
.trim();


const description =
document.getElementById("description")
.value
.trim();



/*
========================
التحقق من البيانات
========================
*/


if(!nameAr){

showStatus(
"❌ اكتب اسم المنتج بالعربي",
"error"
);

return;

}


if(!nameEn){

showStatus(
"❌ اكتب اسم المنتج بالإنجليزي",
"error"
);

return;

}


if(!price){

showStatus(
"❌ اكتب سعر المنتج",
"error"
);

return;

}


if(!category){

showStatus(
"❌ اختر تصنيف المنتج",
"error"
);

return;

}


if(!image){

showStatus(
"❌ اكتب اسم صورة المنتج",
"error"
);

return;

}


if(!description){

showStatus(
"❌ اكتب وصف المنتج",
"error"
);

return;

}


/*
========================
بدء الإضافة
========================
*/


button.disabled = true;

button.textContent =
"⏳ جاري إضافة المنتج...";


showStatus(
"⏳ جاري الاتصال بالمتجر...",
"loading"
);


try{


const response =
await fetch(
WORKER_URL + "/add-product",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

nameAr:nameAr,

nameEn:nameEn,

price:price,

image:image,

category:category,

description:description

})

}
);


/*
========================
قراءة الاستجابة
========================
*/


const responseText =
await response.text();


let data;


try{

data =
JSON.parse(responseText);

}

catch{

throw new Error(
"لم تصل استجابة صحيحة من السيرفر"
);

}


/*
========================
فحص النتيجة
========================
*/


if(!response.ok){

throw new Error(
data.message ||
"حدث خطأ أثناء إضافة المنتج"
);

}


if(!data.success){

throw new Error(
data.message ||
"لم تتم إضافة المنتج"
);

}


/*
========================
نجاح
========================
*/


showStatus(

"✅ تمت إضافة المنتج بنجاح!\n\n" +

"تم إرسال المنتج إلى GitHub.\n\n" +

"انتظر قليلًا ثم افتح المتجر."

,"success"

);


/*
========================
مسح الحقول
========================
*/


document.getElementById("nameAr")
.value="";

document.getElementById("nameEn")
.value="";

document.getElementById("price")
.value="";

document.getElementById("category")
.value="";

document.getElementById("image")
.value="";

document.getElementById("description")
.value="";


}

catch(error){


console.error(error);


showStatus(

"❌ لم تتم إضافة المنتج\n\n" +

error.message,

"error"

);

}


finally{


button.disabled = false;

button.textContent =
"➕ إضافة المنتج إلى المتجر";


}

}


/*
========================
عرض الرسائل
========================
*/


function showStatus(message,type){

const status =
document.getElementById("status");

status.className =
"status " + type;

status.textContent =
message;

}
